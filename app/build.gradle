plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'lk.dailymoney.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'lk.dailymoney.tracker'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
}
